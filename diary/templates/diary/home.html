{% extends "base.html" %}

{% block title %}Decade Diaries{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3 mb-0">Decade Diaries</h1>
        <a href="{% url 'diary:create' %}" class="btn btn-primary btn-sm">Create diary</a>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          {% if diaries %}
            <div class="list-group">
              {% for diary in diaries %}
                <a
                  class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                  href="{% url 'diary:detail' diary.id %}"
                >
                  <span class="fw-semibold">{{ diary.title }}</span>
                  <span class="text-muted small">Open</span>
                </a>
              {% endfor %}
            </div>
          {% else %}
            <p class="text-muted mb-0">No diary entries yet.</p>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
{% endblock %}
